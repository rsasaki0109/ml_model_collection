license:
  code:
    spdx: BSD-3-Clause
    status: explicit
    evidence: https://github.com/xinntao/Real-ESRGAN/blob/a4abfb2979a7bbff3f69f58f58ae324608821e27/LICENSE
  weights:
    spdx: BSD-3-Clause
    status: repository_license
    evidence: https://github.com/xinntao/Real-ESRGAN/blob/a4abfb2979a7bbff3f69f58f58ae324608821e27/LICENSE
    note: >-
      realesr-general-x4v3.pth is a release asset of the BSD-3-Clause repository; no separate weights license is stated.
  dataset:
    name: not documented upstream
    note: >-
      The training data of this checkpoint is not documented (unverified).

artifacts:
  onnx:
    file: realesr_general_x4v3.onnx
    fetch: export
    script: export.py
    input_shape: [1, 3, 180, 320]  # deployment setting used for video and benchmarks; the graph is dynamic
    input_format: RGB [0,1]; frames are first downscaled (bicubic) to 320x180, the low-resolution input
    output: "sr [1, 3, 4h, 4w] RGB [0,1] (720x1280 for the deployment setting)"

runtimes:
  onnxruntime: verified

