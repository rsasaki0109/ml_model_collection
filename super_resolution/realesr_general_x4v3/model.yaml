name: realesr_general_x4v3
display_name: realesr-general-x4v3
task: super_resolution
kind: real-world (GAN)
scale: 4
summary: "Real-ESRGAN realesr-general-x4v3: tiny SRVGGNetCompact for general scenes (1.2M params)."

source:
  repository: https://github.com/xinntao/Real-ESRGAN
  commit: a4abfb2979a7bbff3f69f58f58ae324608821e27  # HEAD when added (2026-10-01)
