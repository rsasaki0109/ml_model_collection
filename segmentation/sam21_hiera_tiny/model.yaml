  onnx_revision: 814a066640debee5a91e70aa401fb8e17e030503

license:
  code:
    spdx: Apache-2.0
    status: explicit
    evidence: https://github.com/facebookresearch/sam2/blob/2b90b9f5ceec907a1c18123530e92e794ad901a4/README.md
  weights:
    spdx: Apache-2.0
    status: explicit
    evidence: https://github.com/facebookresearch/sam2/blob/2b90b9f5ceec907a1c18123530e92e794ad901a4/README.md
    note: >-
      README - "The SAM 2 model checkpoints, SAM 2 demo code (front-end and back-end), and SAM 2 training code are licensed under Apache 2.0" (demo fonts are OFL-1.1; an optional post-processing op is under LICENSE_cctorch). The ONNX conversion is by onnx-community
      (onnx-community/sam2.1-hiera-tiny-ONNX), which states no export script or license tag; the
      files are pinned by SHA-256 and checked against transformers (see the
      segmentation README).
  dataset:
    name: SA-1B / SA-V (and others per the paper)
    note: SA-1B and SA-V have their own terms of use; not restated here.

artifacts:
