# Curated metadata. Measured numbers live in benchmarks.yaml / accuracy.yaml (tool-generated).
name: sam21_hiera_tiny
display_name: SAM2.1-Hiera-T
task: segmentation
kind: promptable
prompt_model: dfine_n  # default box prompts (detect, then segment)
summary: "Meta SAM 2.1 (Hiera-Tiny, 38.9M): promptable image / video segmentation. Prompted here with D-FINE-N boxes."

source:
  repository: https://github.com/facebookresearch/sam2
  commit: 2b90b9f5ceec907a1c18123530e92e794ad901a4  # HEAD when added (2026-10-01)
  paper: https://arxiv.org/abs/2408.00714
  weights_repository: https://huggingface.co/facebook/sam2.1-hiera-tiny
  weights_revision: de431c4043854a71d8101e17995dfe596bf101a5
