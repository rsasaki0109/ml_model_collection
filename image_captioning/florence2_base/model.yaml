    input_shape: [1, 3, 768, 768]
    input_format: RGB, resized to 768x768 (PIL bicubic, no crop), ImageNet mean/std
    output: "image features for the language model; captions by greedy decoding with a KV cache"

captioning:
  encoder_file: encoder_model.onnx
  embed_file: embed_tokens.onnx
  decoder_file: decoder_model_merged.onnx
  tokenizer_file: tokenizer.json
  image_size: 768
  prompt: What does the image describe?  # Florence-2's <CAPTION> task prompt (processor task_prompts_without_inputs)
  max_new_tokens: 40

runtimes:
  onnxruntime: verified

reported_accuracy:
  - metric: COCO Caption Karpathy test CIDEr (zero-shot, beam 3)
    value: 133.0
