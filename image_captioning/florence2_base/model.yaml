      The model card declares license: mit (LICENSE file in the repository). ONNX graphs from onnx-community/Florence-2-base (d59e079711c57174f29265539fb4cc9f0f335916); its fp16 merged decoder does not load in ONNX Runtime 1.22 and its decoder_with_past declares a static length, so the fp32 merged decoder is used.
