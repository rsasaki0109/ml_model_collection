# Curated metadata. Measured numbers live in benchmarks.yaml / accuracy.yaml (tool-generated).
name: bootstapir_online
display_name: BootsTAPIR-online
task: point_tracking
kind: online (causal)
summary: "Online BootsTAPIR (DeepMind, ACCV 2024): causal tracking of any point, frame by frame at 256x256. 4 PIPs refinement iterations (the checkpoint's setting)."

source:
  repository: https://github.com/google-deepmind/tapnet
  commit: 730cda1c730877cfedbe01bf87fb1cadb78a565d  # HEAD when added (2026-10-02)
  paper: https://arxiv.org/abs/2402.00847
  export_code: https://github.com/ibaiGorordo/Tapir-Pytorch-Inference/tree/3b6e84523011976d25f37365e12881f16216003e

license:
  code:
    spdx: Apache-2.0
    status: explicit
    evidence: https://github.com/google-deepmind/tapnet/blob/730cda1c730877cfedbe01bf87fb1cadb78a565d/LICENSE
    note: >-
      The ONNX is exported with ibaiGorordo/Tapir-Pytorch-Inference (3b6e84523011976d25f37365e12881f16216003e), an Apache-2.0 inference port of
      tapnet's PyTorch TAPIR.
  weights:
    spdx: Apache-2.0
    status: explicit
    evidence: https://github.com/google-deepmind/tapnet/blob/730cda1c730877cfedbe01bf87fb1cadb78a565d/README.md
    note: >-
      causal_bootstapir_checkpoint.pt (SHA-256 87c1e752cf5ce56e3e2f7da460aeb4d40fc826d04ef2939bade86a5c7495377f) from
      DeepMind's bucket; the tapnet README's License and Disclaimer section covers the released checkpoints (Apache-2.0).
  dataset:
    name: Kubric MOVi-F (synthetic) + ~15M unlabelled internet video clips (self-training)
    note: >-
      Kubric code is Apache-2.0; no explicit MOVi data license found (unverified). The real videos used for
      bootstrapping are not released and their licenses are not stated (unverified).

artifacts:
  onnx:
    file: bootstapir_online.onnx
    fetch: export
    script: export.py
    input_shape: [1, 3, 256, 256]  # one frame; plus query_feats / causal_state for 256 points
    input_format: RGB resized to 256x256, x / 255 * 2 - 1
    output: "tracks [1,256,2] (x, y at 256x256), visibles [1,256], new_causal_state, feature grids"

point_tracking:
  encoder_file: bootstapir_online_encoder.onnx
  resolution: 256
  pips_iters: 4
  num_points: 256  # fixed in the graph

runtimes:
  onnxruntime: verified

reported_accuracy:
  - metric: TAP-Vid DAVIS first AJ (256x256)
    value: 59.7
    source: https://github.com/google-deepmind/tapnet/blob/730cda1c730877cfedbe01bf87fb1cadb78a565d/README.md  # checkpoint table, Online BootsTAPIR
