    evidence: https://github.com/RT-DETRs/RT-DETRv4/blob/55fefaaed7efe2a5f72d0a18fd4e05965e35c292/LICENSE
  weights:
    spdx: Apache-2.0
    status: repository_license
    evidence: https://github.com/RT-DETRs/RT-DETRv4/blob/55fefaaed7efe2a5f72d0a18fd4e05965e35c292/README.md
    note: >-
      Checkpoint is linked from the README of the Apache-2.0 repository (Google Drive); no separate weights license is stated. Training distils from a DINOv3 ViT-B/16 teacher (DINOv3 License); whether that makes the student weights a derivative of DINOv3 materials is not addressed upstream (unresolved).
  dataset:
