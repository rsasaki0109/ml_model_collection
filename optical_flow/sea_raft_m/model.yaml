# Curated metadata. Measured numbers live in benchmarks.yaml / accuracy.yaml (tool-generated).
name: sea_raft_m
display_name: SEA-RAFT-M
task: optical_flow
summary: "SEA-RAFT M (ECCV 2024): ResNet34 variant; TartanAir + Chairs + Things checkpoint."

source:
  repository: https://github.com/princeton-vl/SEA-RAFT
  commit: 9137517ba24e628442aec097d3afe71d03503b75  # HEAD when added (2026-10-01)
  paper: https://arxiv.org/abs/2405.14793
  weights_repository: https://huggingface.co/MemorySlices/Tartan-C-T432x960-M
  weights_revision: 0ab5da9ac5e6b9c174f420b876ae3d85449c07dd

license:
  code:
    spdx: BSD-3-Clause
    status: explicit
    evidence: https://github.com/princeton-vl/SEA-RAFT/blob/9137517ba24e628442aec097d3afe71d03503b75/LICENSE
  weights:
    spdx: BSD-3-Clause
    status: explicit
    evidence: https://huggingface.co/MemorySlices/Tartan-C-T432x960-M/blob/0ab5da9ac5e6b9c174f420b876ae3d85449c07dd/README.md
    note: >-
      The HF model card declares license: bsd-3-clause. The Tartan-C-T checkpoint has not seen Sintel, so Sintel-train evaluation is zero-shot. The paper reports no Sintel-train number for exactly this checkpoint (Table 2 lists M only without TartanAir).
  dataset:
    name: TartanAir, FlyingChairs, FlyingThings3D
    note: >-
      TartanAir is CC BY 4.0 (https://theairlab.org/tartanair-dataset/). FlyingChairs and FlyingThings3D are 'provided for research purposes only ... Any commercial use is prohibited' (https://lmb.informatik.uni-freiburg.de/resources/datasets/FlyingChairs.en.html, https://lmb.informatik.uni-freiburg.de/resources/datasets/SceneFlowDatasets.en.html).
  export_dependencies:
    - {name: huggingface_hub, spdx: Apache-2.0}
    - {name: safetensors, spdx: Apache-2.0}

artifacts:
  onnx:
    file: sea_raft_m.onnx
    fetch: export
    script: export.py
    input_shape: [1, 3, 432, 768]  # image1 and image2; fixed
    input_format: RGB float 0-255 (the graph applies 2*x/255-1 and pads to /8), resized to 432x768
    output: "flow [1, 2, 432, 768] (u, v) in input pixels, image1 -> image2"

runtimes:
  onnxruntime: verified

reported_accuracy: []
