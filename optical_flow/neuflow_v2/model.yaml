# Curated metadata. Measured numbers live in benchmarks.yaml / accuracy.yaml (tool-generated).
name: neuflow_v2
display_name: NeuFlow-v2
task: optical_flow
summary: "NeuFlow v2 (2024): real-time optical flow for edge devices (9M params); FlyingThings checkpoint."

source:
  repository: https://github.com/neufieldrobotics/NeuFlow_v2
  commit: 204b5e3744461d90303b9ff82caa7a1bb56a2ca2  # HEAD when added (2026-10-01)
  paper: https://arxiv.org/abs/2408.10161
  weights_repository: https://github.com/neufieldrobotics/NeuFlow_v2/blob/204b5e3744461d90303b9ff82caa7a1bb56a2ca2/neuflow_things.pth

license:
  code:
    spdx: Apache-2.0
    status: explicit
    evidence: https://github.com/neufieldrobotics/NeuFlow_v2/blob/204b5e3744461d90303b9ff82caa7a1bb56a2ca2/LICENSE
  weights:
    spdx: Apache-2.0
    status: repository_license
    evidence: https://github.com/neufieldrobotics/NeuFlow_v2/blob/204b5e3744461d90303b9ff82caa7a1bb56a2ca2/LICENSE
    note: >-
      neuflow_things.pth (sha256 733d13b1b2202adefcc99bd1f0fceb89fc90da5479f9826fa3f17ff42c4bdbe0) is committed to the Apache-2.0 repository; no separate weights license. The repository's neuflow_mixed / neuflow_sintel checkpoints are fine-tuned on Sintel, so the FlyingThings one is used to keep Sintel-train evaluation zero-shot.
  dataset:
    name: FlyingThings3D
    note: >-
      FlyingChairs and FlyingThings3D are 'provided for research purposes only ... Any commercial use is prohibited' (https://lmb.informatik.uni-freiburg.de/resources/datasets/FlyingChairs.en.html, https://lmb.informatik.uni-freiburg.de/resources/datasets/SceneFlowDatasets.en.html).

artifacts:
  onnx:
    file: neuflow_v2.onnx
    fetch: export
    script: export.py
    input_shape: [1, 3, 432, 768]  # image1 and image2; fixed
    input_format: RGB float 0-255 (the graph divides by 255), resized to 432x768
    output: "flow [1, 2, 432, 768] (u, v) in input pixels, image1 -> image2"

runtimes:
  onnxruntime: verified

reported_accuracy:
  - metric: Sintel train clean EPE (FlyingThings only, zero-shot)
    value: 1.24
    source: https://arxiv.org/abs/2408.10161  # Table II 'Full' / Table III default iterations
  - metric: Sintel train final EPE (FlyingThings only, zero-shot)
    value: 2.67
    source: https://arxiv.org/abs/2408.10161  # Table II 'Full' / Table III default iterations
