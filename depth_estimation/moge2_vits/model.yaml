name: moge2_vits
display_name: MoGe-2-S
task: depth_estimation
output: metric_depth_m
summary: "Microsoft MoGe-2 (ViT-S, 35M, with normals): metric point map, depth, normals and camera FOV from one image. Official author ONNX."

