      under the Apache 2.0 license."
  weights:
    spdx: MIT
    status: explicit
    evidence: https://huggingface.co/Ruicheng/moge-2-vits-normal/blob/26b477f41595707c5db6770294c0d1721e8ed4ed/README.md
    note: >-
      The PyTorch checkpoint's model card declares license mit. The ONNX
      repository (Ruicheng/moge-2-vits-normal-onnx, same author, linked from
      the upstream docs/onnx.md) carries no license tag; the license is taken
      from the checkpoint it was exported from.
  dataset:
