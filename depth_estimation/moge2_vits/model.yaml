artifacts:
  onnx:
    file: moge2_vits.onnx
    fetch: download
    url: https://huggingface.co/Ruicheng/moge-2-vits-normal-onnx/resolve/e50ffda41565591092adea54c6ac83d6212e1e23/model.onnx
    sha256: 24eacb5dc7a2c54c7bc98f7de085ffbed79ad006ea5b664c2c2cdc02ff3a52f0
    input_shape: [1, 3, 720, 1280]  # dynamic H/W; the value recorded is for the demo clip
    input_format: "RGB in [0, 1] at any resolution (normalisation is inside the graph); num_tokens (int64 scalar) = 1800"
    output: "points [1,H,W,3] affine point map, normal [1,H,W,3], mask [1,H,W] (sigmoid), scale [1] metric scale"

runtimes:
  onnxruntime: verified

notes: >-
  The official ONNX equals upstream PyTorch in `onnx_compatible_mode`
  (point-map relative difference 2e-6 on the demo frame). That mode itself
  differs from default PyTorch inference by about 2% in the point map and
  1% in metric scale (upstream replaces non-exportable resize ops), so
  metric depth from this artifact is ~3% off `MoGeModel.infer()` on the same
  frame.

