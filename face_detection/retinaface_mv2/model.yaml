name: retinaface_mv2
display_name: RetinaFace-MV2
task: face_detection
landmarks: 5
summary: "RetinaFace with a MobileNetV2 backbone (yakhyo/retinaface-pytorch): 3.1M params, 5 landmarks."

source:
  repository: https://github.com/yakhyo/retinaface-pytorch
  commit: 4cd6e3471e5bac794637290a530566f463db4762  # HEAD when added (2026-10-01)
