# Curated metadata. Measured numbers live in benchmarks.yaml / accuracy.yaml (tool-generated).
name: scrfd_10g
display_name: SCRFD-10G
task: face_detection
landmarks: 5
summary: "SCRFD-10GF with keypoints (InsightFace, ICLR 2022). Weights are non-commercial research only."

source:
  repository: https://github.com/deepinsight/insightface
  commit: 1480e705287bc5d59f923b46c260ec6e3e4150f6  # HEAD when added (2026-10-01)
  paper: https://arxiv.org/abs/2105.04714

license:
  code:
    spdx: MIT
    status: explicit
    evidence: https://github.com/deepinsight/insightface/blob/1480e705287bc5d59f923b46c260ec6e3e4150f6/README.md
    note: >-
      The README's License section states the code is MIT; GitHub detects no SPDX license file.
  weights:
    spdx: LicenseRef-InsightFace-NC
    status: explicit
    evidence: https://github.com/deepinsight/insightface/blob/1480e705287bc5d59f923b46c260ec6e3e4150f6/README.md
    note: >-
      README: the pretrained models (manually or auto-downloaded) are 'available for non-commercial research purposes only'. Mirrors that relabel SCRFD as MIT (ModelScope, UniFace) contradict upstream.
  dataset:
    name: WIDER FACE
    note: >-
      WIDER FACE: 'Creative Common License (cc by-nc-nd)' (http://shuoyang1213.me/WIDERFACE/; HF mirror CUHK-CSE/wider_face db171f1b7fedf4d3453e81297ff02f9915356d19 states CC BY-NC-ND 4.0). Whether this constrains the trained weights is a legal question (unverified). Landmark annotations (RetinaFace / SCRFD releases) state no license (unverified).

artifacts:
  onnx:
    file: scrfd_10g.onnx
    fetch: download_zip
    url: https://github.com/deepinsight/insightface/releases/download/model-zoo/buffalo_l.zip
    zip_sha256: 80ffe37d8a5940d59a7384c201a2a38d4741f2f3c51eef46ebb28218a7b0ca2f
    member: det_10g.onnx
    sha256: 5838f7fe053675b1c7a08b633df49e7af5495cee0493c7dcf6697200b85b5b91
    input_shape: [1, 3, 640, 640]  # outputs are fixed for 640x640
    input_format: RGB, (x - 127.5) / 128, aspect-preserving resize into the top-left of 640x640
    output: "9 tensors: scores [N,1], bbox distances [N,4], kps [N,10] for strides 8, 16, 32 (2 anchors per cell)"

runtimes:
  onnxruntime: verified

