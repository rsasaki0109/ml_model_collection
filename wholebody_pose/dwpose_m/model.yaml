# Curated metadata. Measured numbers live in benchmarks.yaml / accuracy.yaml (tool-generated).
name: dwpose_m
display_name: DWPose-m
task: wholebody_pose
kind: top-down
keypoints: coco_wholebody_133
person_detector: dfine_n  # source of person boxes (top-down)
summary: "DWPose-m (IDEA): RTMPose-m distilled for whole-body (133 kp), official mmpose ONNX; person boxes from D-FINE-N."

source:
  repository: https://github.com/IDEA-Research/DWPose
  commit: 3dca5db79d9f9ffdd378753ddf6ec66535aace88  # HEAD when added (2026-10-02)
  paper: https://arxiv.org/abs/2307.15880

license:
  code:
    spdx: Apache-2.0
    status: explicit
    evidence: https://github.com/IDEA-Research/DWPose/blob/3dca5db79d9f9ffdd378753ddf6ec66535aace88/LICENSE
  weights:
    spdx: Apache-2.0
    status: repository_license
    evidence: https://github.com/open-mmlab/mmpose/blob/759b39c13fea6ba094afc1fa932f51dc1b11cbf9/projects/rtmpose/README.md
    note: >-
      Official mmpose ONNX SDK archive on download.openmmlab.com, linked from the mmpose README; no separate weights license.
      The training data is non-commercial (see dataset).
  dataset:
    name: COCO-WholeBody + UBody
    note: >-
      COCO-WholeBody: 'ONLY for research and non-commercial use' (Terms of Use, https://github.com/jin-s13/COCO-WholeBody/blob/76f3b6331b6e15553fbee05951dbf49f1fad029c/README.md); UBody access by form, terms unverified.

artifacts:
  onnx:
    file: dwpose_m.onnx
    fetch: download_zip
    url: https://download.openmmlab.com/mmpose/v1/projects/rtmposev1/onnx_sdk/rtmpose-m_simcc-ucoco_dw-ucoco_270e-256x192-c8b76419_20230728.zip
    zip_sha256: a4e4d56e9dc043e2171c73f5918f334509a47fde60182c1961370c7160334ac0
    member: 20230831/rtmpose_onnx/rtmpose-m_simcc-ucoco_dw-ucoco_270e-256x192-c8b76419_20230728/end2end.onnx
    sha256: 94ca58fa2d6c4530b6957ac9548084ebc2fa27ed71e4e01f0b73844306ed01a6
    input_shape: [-1, 3, 256, 192]  # batch of person crops
    input_format: per person box - padding 1.25, affine warp, RGB, mean (123.675,116.28,103.53) std (58.395,57.12,57.375)
    output: "simcc_x [B,133,2W], simcc_y [B,133,2H] (split ratio 2)"

runtimes:
  onnxruntime: verified

reported_accuracy:
  - metric: COCO-WholeBody val whole AP (detector boxes)
    value: 60.6
    source: https://github.com/IDEA-Research/DWPose/blob/3dca5db79d9f9ffdd378753ddf6ec66535aace88/README.md
  - metric: COCO-WholeBody val body AP (detector boxes)
    value: 68.5
    source: https://github.com/IDEA-Research/DWPose/blob/3dca5db79d9f9ffdd378753ddf6ec66535aace88/README.md
  - metric: COCO-WholeBody val hand AP (detector boxes)
    value: 52.7
    source: https://github.com/IDEA-Research/DWPose/blob/3dca5db79d9f9ffdd378753ddf6ec66535aace88/README.md
