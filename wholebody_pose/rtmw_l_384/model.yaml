# Curated metadata. Measured numbers live in benchmarks.yaml / accuracy.yaml (tool-generated).
name: rtmw_l_384
display_name: RTMW-l-384
task: wholebody_pose
kind: top-down
keypoints: coco_wholebody_133
person_detector: dfine_n  # source of person boxes (top-down)
summary: "RTMW-l (mmpose, 2024): whole-body RTMPose trained on 14 datasets (Cocktail14), 384x288, official ONNX; person boxes from D-FINE-N."

source:
  repository: https://github.com/open-mmlab/mmpose
  commit: 759b39c13fea6ba094afc1fa932f51dc1b11cbf9  # HEAD when added (2026-10-02)
  paper: https://arxiv.org/abs/2407.08634

license:
  code:
    spdx: Apache-2.0
    status: explicit
    evidence: https://github.com/open-mmlab/mmpose/blob/759b39c13fea6ba094afc1fa932f51dc1b11cbf9/LICENSE
  weights:
    spdx: Apache-2.0
    status: repository_license
    evidence: https://github.com/open-mmlab/mmpose/blob/759b39c13fea6ba094afc1fa932f51dc1b11cbf9/projects/rtmpose/README.md
    note: >-
      Official mmpose ONNX SDK archive on download.openmmlab.com, linked from the mmpose README; no separate weights license.
      The training data is non-commercial (see dataset).
  dataset:
    name: Cocktail14 (14 datasets incl. COCO-WholeBody, Human-Art, LaPa, InterHand2.6M, UBody, AIC, Halpe, ...)
    note: >-
      COCO-WholeBody: 'ONLY for research and non-commercial use' (Terms of Use, https://github.com/jin-s13/COCO-WholeBody/blob/76f3b6331b6e15553fbee05951dbf49f1fad029c/README.md); Human-Art and LaPa non-commercial; InterHand2.6M CC BY-NC 4.0; other members unverified.

artifacts:
  onnx:
    file: rtmw_l_384.onnx
    fetch: download_zip
    url: https://download.openmmlab.com/mmpose/v1/projects/rtmw/onnx_sdk/rtmw-dw-x-l_simcc-cocktail14_270e-384x288_20231122.zip
    zip_sha256: a87e1af41a0a067776dba7d46e1c21c8f6e9f18e247e0e606718dd1f31e96ffd
    member: end2end.onnx
    sha256: bd033156e5104c4f5d2edfe0453e02661e30a2f3da453ec93c8764d561b83054
    input_shape: [-1, 3, 384, 288]  # batch of person crops
    input_format: per person box - padding 1.25, affine warp, RGB, mean (123.675,116.28,103.53) std (58.395,57.12,57.375)
    output: "simcc_x [B,133,2W], simcc_y [B,133,2H] (split ratio 2)"

runtimes:
  onnxruntime: verified

