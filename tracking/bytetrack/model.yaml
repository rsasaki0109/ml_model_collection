# Curated metadata. Measured numbers live in benchmarks.yaml / accuracy.yaml (tool-generated).
name: bytetrack
display_name: ByteTrack
task: tracking
summary: "ByteTrack (ECCV 2022): two-stage IoU association that also uses low-score detections; motion only."
detector: dfine_s  # person boxes (COCO class "person") from this collection's D-FINE-S

source:
  repository: https://github.com/rsasaki0109/ml_model_collection
  commit: null  # implemented in this repository (tools/mlmc/tracking.py)
  paper: https://arxiv.org/abs/2110.06864
  reference_implementation: https://github.com/ifzhang/ByteTrack/tree/d1bf0191adff59bc8fcfeaa0b33d3d1642552a99/yolox/tracker

license:
  code:
    spdx: Apache-2.0
    status: explicit
    evidence: https://github.com/rsasaki0109/ml_model_collection/blob/main/LICENSE
    note: >-
      Written from scratch for this repository from the paper and the published default parameters;
      no code copied from the MIT reference implementation (whose Kalman filter derives from GPL-3.0 DeepSORT).
  weights:
    spdx: Apache-2.0
    status: explicit
    evidence: https://huggingface.co/ustc-community/dfine-small-coco/blob/f79e65b5fbb33ceb9d3ebba042955d7410c608f8/README.md
    note: >-
      The tracker has no weights; the only learned component is the D-FINE-S detector (COCO-only checkpoint, apache-2.0).
  dataset:
    name: COCO 2017 (detector)
    note: >-
      Annotations CC BY 4.0; images are subject to Flickr terms of use. No tracking data is used for training.

artifacts:
  onnx:
    file: dfine_s.onnx
    fetch: reuse
    model: dfine_s
    input_shape: [1, 3, 640, 640]  # the detector's input
    input_format: as object_detection/dfine_s
    output: "tracks: boxes, ids, scores (host-side tracker after the detector graph)"

tracker:
  algorithm: bytetrack
  det_score_floor: 0.1  # detector boxes kept for the tracker (low-score association)
  aspect_ratio_max: 1.6  # drop tracks wider than 1.6 x their height (pedestrian setting of all three references)
  params: {track_thresh: 0.5, low_thresh: 0.1, match_thresh: 0.8, second_thresh: 0.5, unconfirmed_thresh: 0.7, track_buffer: 30, min_box_area: 10}  # ByteTrack demo defaults (tools/demo_track.py); new tracks need score >= track_thresh + 0.1.

runtimes:
  onnxruntime: verified

reported_accuracy:
  - metric: MOT17 test HOTA (YOLOX-X MOT detector, upstream)
    value: 63.1
    source: https://github.com/ifzhang/ByteTrack/blob/d1bf0191adff59bc8fcfeaa0b33d3d1642552a99/README.md
  - metric: MOT17 test MOTA (YOLOX-X MOT detector, upstream)
    value: 80.3
    source: https://github.com/ifzhang/ByteTrack/blob/d1bf0191adff59bc8fcfeaa0b33d3d1642552a99/README.md
  - metric: MOT17 test IDF1 (YOLOX-X MOT detector, upstream)
    value: 77.3
    source: https://github.com/ifzhang/ByteTrack/blob/d1bf0191adff59bc8fcfeaa0b33d3d1642552a99/README.md
