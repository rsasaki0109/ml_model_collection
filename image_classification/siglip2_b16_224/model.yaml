# Curated metadata. Measured numbers live in benchmarks.yaml / accuracy.yaml (tool-generated).
name: siglip2_b16_224
display_name: SigLIP2-B/16 (zero-shot)
task: image_classification
kind: zero-shot (image-text)
summary: "SigLIP 2 base, patch 16, 224 px (Google, 2025): image tower ONNX + precomputed text embeddings of the 1000 ImageNet class prompts."

source:
  repository: https://github.com/google-research/big_vision
  commit: 0127fb6b337ee2a27bf4e54dea79cff176527356  # HEAD when added (2026-10-02)
  paper: https://arxiv.org/abs/2502.14786
  weights_repository: https://huggingface.co/google/siglip2-base-patch16-224
  weights_revision: 75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2

license:
  code:
    spdx: Apache-2.0
    status: explicit
    evidence: https://github.com/google-research/big_vision/blob/0127fb6b337ee2a27bf4e54dea79cff176527356/LICENSE
  weights:
    spdx: Apache-2.0
    status: explicit
    evidence: https://huggingface.co/google/siglip2-base-patch16-224/blob/75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2/README.md
    note: >-
      The model card declares license: apache-2.0. The image-tower ONNX comes from onnx-community/siglip2-base-patch16-224-ONNX
      (ba1f3b0843f24bc5417d38e19c37b287d719b2f4; that repository has no license tag). Text embeddings are computed from the
      official checkpoint by export.py with open_clip's class names and 7 'simple' templates (MIT-style open_clip license).
  dataset:
    name: WebLI (Google, not released)
    note: >-
      Training data is not public; its terms are not stated (unverified).

artifacts:
  onnx:
    file: siglip2_b16_224.onnx
    fetch: export
    script: export.py
    input_shape: [1, 3, 224, 224]
    input_format: RGB, resized to 224x224 without crop (PIL bilinear), (x/255 - 0.5) / 0.5
    output: "pooler_output [B, 768] image embedding; compared with imagenet_text_embeddings.npy [1000, 768]"

classification:
  size: 224
  interpolation: bilinear
  mean: [0.5, 0.5, 0.5]
  std: [0.5, 0.5, 0.5]
  image_output: pooler_output
  text_embeddings: imagenet_text_embeddings.npy
  prompts: open_clip SIMPLE_IMAGENET_TEMPLATES (7), lower-cased, 64 tokens

runtimes:
  onnxruntime: verified

reported_accuracy:
  - metric: ImageNet-1k val zero-shot top-1
    value: 78.2
    source: https://arxiv.org/abs/2502.14786  # Table 1, B/16 at 224
  - metric: ImageNetV2 zero-shot top-1
    value: 71.4
    source: https://arxiv.org/abs/2502.14786  # Table 1, B/16 at 224
