# Curated metadata. Measured numbers live in benchmarks.yaml / accuracy.yaml (tool-generated).
name: mobilenetv4_conv_medium
display_name: MobileNetV4-Conv-M
task: image_classification
kind: supervised (ImageNet-1k)
summary: "MobileNetV4 conv medium (timm e500 recipe, 9.7M params, 1.1 GMACs), official onnx-community export."

source:
  repository: https://github.com/huggingface/pytorch-image-models
  commit: 92dbd9e3f9b5d61c4d008223410781da983239fc  # HEAD when added (2026-10-02)
  paper: https://arxiv.org/abs/2404.10518
  weights_repository: https://huggingface.co/timm/mobilenetv4_conv_medium.e500_r256_in1k
  weights_revision: ad66898c045c1b5223ea3f2c0830b74cf2e75bac

license:
  code:
    spdx: Apache-2.0
    status: explicit
    evidence: https://github.com/huggingface/pytorch-image-models/blob/92dbd9e3f9b5d61c4d008223410781da983239fc/LICENSE
  weights:
    spdx: Apache-2.0
    status: explicit
    evidence: https://huggingface.co/timm/mobilenetv4_conv_medium.e500_r256_in1k/blob/ad66898c045c1b5223ea3f2c0830b74cf2e75bac/README.md
    note: >-
      The timm model card declares license: apache-2.0. ONNX from onnx-community (pixel_values -> logits).
  dataset:
    name: ImageNet-1k
    note: >-
      ImageNet: 'non-commercial research and educational purposes' (terms of access); the timm README notes 'one should assume that the original dataset license applies to the weights' (https://github.com/huggingface/pytorch-image-models/blob/92dbd9e3f9b5d61c4d008223410781da983239fc/README.md#licenses).

artifacts:
  onnx:
    file: mobilenetv4_conv_medium.onnx
    fetch: download
    url: https://huggingface.co/onnx-community/mobilenetv4_conv_medium.e500_r256_in1k/resolve/46483fa826d2e19a097d182e35d1988f51c2180b/onnx/model.onnx
    sha256: f67257da6f91c00cd1d063a61a377718f004305c1299360a5c077e4c2b02b67a
    input_shape: [1, 3, 256, 256]
    input_format: RGB, shorter side resized to size / crop_pct (PIL bicubic), centre crop, ImageNet mean/std
    output: "logits [B, 1000] (ImageNet-1k class index order)"

classification:
  size: 256
  crop_pct: 0.95
  interpolation: bicubic

runtimes:
  onnxruntime: verified

reported_accuracy:
  - metric: ImageNet-1k val top-1 (timm results)
    value: 79.916
    source: https://github.com/huggingface/pytorch-image-models/blob/92dbd9e3f9b5d61c4d008223410781da983239fc/results/results-imagenet.csv
  - metric: ImageNetV2 matched-frequency top-1 (timm results)
    value: 69.0
    source: https://github.com/huggingface/pytorch-image-models/blob/92dbd9e3f9b5d61c4d008223410781da983239fc/results/results-imagenetv2-matched-frequency.csv
